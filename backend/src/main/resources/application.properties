spring.application.name=backend

# PostgreSQL. The defaults match docker-compose.yml at the repo root
# (`docker compose up -d`); render.yaml supplies these as env vars in the cloud.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:eclinician}
spring.datasource.username=${DB_USER:eclinician}
spring.datasource.password=${DB_PASSWORD:eclinician}

# Flyway owns the schema; Hibernate only checks that the mapping still matches it.
# baseline-on-migrate lets the already-deployed database adopt V1 without re-running it.
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Render assigns the port at runtime.
server.port=${PORT:8080}

# Comma-separated browser origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Signing key for login tokens, from the environment only — no key is committed. Unset,
# the app generates a random one per boot (see SecurityConfig); render.yaml generates a
# real one per deployment.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:480}

# The visit-summary drafter (services/SummaryDrafter). Whichever key is set decides which
# service answers; `auto` prefers OpenAI when both are. No key is committed, and with
# neither the feature reports itself off and nothing else changes.
app.ai.provider=${AI_PROVIDER:auto}
app.ai.openai.api-key=${OPENAI_API_KEY:}
app.ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
app.ai.openai.endpoint=${OPENAI_ENDPOINT:https://api.openai.com/v1/chat/completions}
app.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic.model=${ANTHROPIC_MODEL:claude-opus-5}

# Shared password for the seeded demo staff accounts (see UserSeeder).
app.demo-password=${DEMO_PASSWORD:demo1234}
