spring.application.name=backend

# PostgreSQL. The defaults match docker-compose.yml at the repo root
# (`docker compose up -d`); render.yaml supplies these as env vars in the cloud.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:eclinician}
spring.datasource.username=${DB_USER:eclinician}
spring.datasource.password=${DB_PASSWORD:eclinician}

# Hibernate manages the schema for now; we'll move to migrations before prod.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Render assigns the port at runtime.
server.port=${PORT:8080}

# Comma-separated browser origins allowed to call the API.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Signing key for login tokens. HS256 needs at least 32 bytes; the default below is a
# development value only — render.yaml generates a real one per deployment.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdefghijklmnop}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:480}

# Shared password for the seeded demo staff accounts (see UserSeeder).
app.demo-password=${DEMO_PASSWORD:demo1234}
