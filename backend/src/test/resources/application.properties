spring.datasource.url=jdbc:h2:mem:eclinician
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

# The migrations are Postgres SQL; tests run on H2, where Hibernate builds the schema
# from the same entities the migrations were written from.
spring.flyway.enabled=false

# The test file replaces the main one, so security needs its own key here.
app.jwt.secret=test-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
app.jwt.ttl-minutes=5
